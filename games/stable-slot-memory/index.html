<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stable Slot Memory</title><link rel="stylesheet" href="../style.css"></head><body><main><div class="top"><h1>Stable Slot Memory</h1><a href="../">← Arcade</a></div><div class="card"><p>Remove a slot. Cossert leaves it empty instead of shifting later IDs.</p><div id="slots" class="slots"></div><p id="msg"></p><button id="reset">Reset</button></div><p class="muted">Logic source: <a href="game.cossert">game.cossert</a></p></main><script src="../interpreter.js"></script><script>
let rt;const box=document.getElementById("slots");function draw(){box.innerHTML="";rt.list("inventory").forEach((v,i)=>{let b=document.createElement("button");b.className="slot";b.textContent=i+": "+(v||'""');b.disabled=v==="";b.onclick=()=>{let old=rt.takeItOut("inventory",i);msg.textContent='TAKITOUT{inventory}['+i+'] removed '+old+'; IDs stayed stable.';draw()};box.appendChild(b)})}async function init(){rt=await loadCossert("game.cossert");draw()}reset.onclick=init;init();
</script></body></html>
