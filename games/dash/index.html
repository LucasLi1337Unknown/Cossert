<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert Dash</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<div class="gameTop"><h1>Cossert Dash</h1><a class="back" href="../">← Arcade</a></div>
<div class="panel"><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill" id="stat">Ready</div></div><canvas id="game" width="760" height="440"></canvas><div class="controls"><button id="restart">Restart</button><button id="jump">Jump / Space</button></div><p class="help">Space, ↑, click the game, or tap Jump. Coins are optional; survival isn't.</p><p class="source">Game data/rules: <a href="game.cossert">game.cossert</a> · Runtime: <a href="../interpreter.js">interpreter.js</a></p></div>
</div><script src="../interpreter.js"></script><script>
let rt,c=game,x=c.getContext("2d"),p,obs,coins,sc,dist,alive,frame,raf;
function reset(){cancelAnimationFrame(raf);p={x:90,y:350,w:34,h:48,vy:0};obs=[];coins=[];sc=dist=frame=0;alive=true;loop()}
function jump(){if(alive&&p.y>=350)p.vy=rt.value("physics",1,-12);else if(!alive)reset()}
function loop(){frame++;let grav=rt.value("physics",0,.72),spd=rt.list("speed")[Math.min(5,Math.floor(dist/800))];p.vy+=grav;p.y+=p.vy;if(p.y>350){p.y=350;p.vy=0}if(frame%rt.randomFromList("spawnGap")===0){let w=rt.randomFromList("obstacleWidths");obs.push({x:760,y:382,w,h:28});if(Math.random()<.7)coins.push({x:800,y:300-Math.random()*100,r:10})}obs.forEach(o=>o.x-=spd);coins.forEach(o=>o.x-=spd);obs=obs.filter(o=>o.x>-60);coins=coins.filter(o=>o.x>-30&&!o.got);for(let o of obs)if(p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y)alive=false;for(let q of coins)if(Math.hypot(p.x+17-q.x,p.y+24-q.y)<32){q.got=true;sc+=rt.randomFromList("coinScores")}dist+=spd/10;draw();if(alive)raf=requestAnimationFrame(loop);else stat.textContent="CRASH! Space/click to restart"}
function draw(){x.fillStyle="#081525";x.fillRect(0,0,760,440);x.fillStyle="#17304d";x.fillRect(0,398,760,42);x.fillStyle="#60a5fa";x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle="#fb923c";obs.forEach(o=>x.fillRect(o.x,o.y,o.w,o.h));x.fillStyle="#facc15";coins.forEach(q=>{if(!q.got){x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()}});score.textContent=Math.floor(sc+dist);stat.textContent=alive?"Distance "+Math.floor(dist)+"m":"CRASH!"}
addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();jump()}});game.onclick=jump;jump.onclick=jump;restart.onclick=reset;loadCossert("game.cossert").then(v=>{rt=v;reset()});
</script></body></html>
