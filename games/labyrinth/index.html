<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List Labyrinth</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<div class="gameTop"><h1>List Labyrinth</h1><a class="back" href="../">← Arcade</a></div>
<div class="panel"><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill" id="stat">Ready</div></div><canvas id="game" width="684" height="468"></canvas><div class="controls"><button id="restart">Restart</button></div><div class="dpad"><button class="up secondary" data-key="ArrowUp">↑</button><button class="left secondary" data-key="ArrowLeft">←</button><button class="down secondary" data-key="ArrowDown">↓</button><button class="right secondary" data-key="ArrowRight">→</button></div><p class="help">Trigger 🔴 and 🔵 to empty stable inventory slots, then escape through 🚪.</p><p class="source">Game data/rules: <a href="game.cossert">game.cossert</a> · Runtime: <a href="../interpreter.js">interpreter.js</a></p></div>
</div><script src="../interpreter.js"></script><script>
let rt,c=game,x=c.getContext("2d"),map,p,inv,sc=0;const S=36;
function init(){map=rt.list("map").map(r=>r.split(""));inv=rt.list("inventory");for(let y=0;y<map.length;y++)for(let xx=0;xx<map[y].length;xx++)if(map[y][xx]==="P"){p={x:xx,y};map[y][xx]="."}draw()}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy,t=map[ny]?.[nx];if(!t||t==="#")return;if(t==="A"){inv[0]="";map[ny][nx]=".";sc+=40}if(t==="B"){inv[2]="";map[ny][nx]=".";sc+=60}if(t==="E"){if(inv[0]!==""||inv[2]!==""){stat.textContent="Two locks remain: find A and B";return}else{sc+=150;score.textContent=sc;stat.textContent="MAZE CLEARED!";return}}p={x:nx,y:ny};draw()}
function draw(){x.fillStyle="#07101d";x.fillRect(0,0,c.width,c.height);for(let y=0;y<map.length;y++)for(let xx=0;xx<map[y].length;xx++){let t=map[y][xx];x.fillStyle=t==="#"?"#29384a":"#0c1b2e";x.fillRect(xx*S,y*S,S-1,S-1);if("ABE".includes(t)){x.font="22px system-ui";x.fillText(t==="A"?"🔴":t==="B"?"🔵":"🚪",xx*S+6,y*S+27)}}x.font="24px system-ui";x.fillText("🙂",p.x*S+5,p.y*S+27);score.textContent=sc;stat.textContent="Slots: ["+inv.map(v=>v||'""').join(", ")+"]"}
function go(k){if(k==="ArrowUp")move(0,-1);if(k==="ArrowDown")move(0,1);if(k==="ArrowLeft")move(-1,0);if(k==="ArrowRight")move(1,0)}
addEventListener("keydown",e=>go(e.key));document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>go(b.dataset.key));restart.onclick=()=>{sc=0;init()};loadCossert("game.cossert").then(v=>{rt=v;init()});
</script></body></html>
