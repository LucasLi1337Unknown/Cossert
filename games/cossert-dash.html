<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert Dash</title><link rel="stylesheet" href="style.css"></head><body><main><div class="top"><h1>🏃 Cossert Dash</h1><a href="index.html">← Arcade</a></div><div class="card"><p>Jump over red bugs. Collect blue Cossert tokens. The game gets faster every 10 points.</p><div class="hud"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Best: <b id="best">0</b></span><span class="pill"><kbd>Space</kbd>/<kbd>↑</kbd> jump</span></div><canvas id="game" width="900" height="420"></canvas><p id="msg" class="center muted">Press Space or click the game to start.</p></div><script>
const c=document.getElementById("game"),x=c.getContext("2d"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),msg=document.getElementById("msg");let p={x:90,y:320,w:38,h:48,vy:0},obs=[],tokens=[],running=false,score=0,speed=6,last=0,spawn=0,tokenSpawn=0,best=+localStorage.cossertDashBest||0;bestEl.textContent=best;
function reset(){p.y=320;p.vy=0;obs=[];tokens=[];score=0;speed=6;spawn=0;tokenSpawn=0;scoreEl.textContent=0}function start(){if(running)return;reset();running=true;last=performance.now();msg.textContent="";requestAnimationFrame(loop)}function jump(){if(!running){start();return}if(p.y>=319)p.vy=-15}addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});c.addEventListener("pointerdown",jump);function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function loop(t){if(!running)return;let dt=Math.min(32,t-last);last=t;p.vy+=.8;p.y+=p.vy;if(p.y>320){p.y=320;p.vy=0}spawn-=dt;tokenSpawn-=dt;if(spawn<=0){obs.push({x:920,y:338,w:30+Math.random()*25,h:30+Math.random()*45});spawn=800+Math.random()*700}if(tokenSpawn<=0){tokens.push({x:920,y:220+Math.random()*95,w:28,h:28,label:["SKIP","FINAL","LIST","W/O"][Math.floor(Math.random()*4)]});tokenSpawn=1000+Math.random()*900}speed=6+Math.floor(score/10)*.45;obs.forEach(o=>o.x-=speed);tokens.forEach(o=>o.x-=speed);for(const o of obs)if(rect(p,o)){running=false;best=Math.max(best,score);localStorage.cossertDashBest=best;bestEl.textContent=best;msg.innerHTML='<span class="lose">CRASHED.</span> Score '+score+'. Press Space to retry.';draw();return}for(let i=tokens.length-1;i>=0;i--)if(rect(p,tokens[i])){tokens.splice(i,1);score++;scoreEl.textContent=score}obs=obs.filter(o=>o.x>-80);tokens=tokens.filter(o=>o.x>-80);draw();requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#07111a";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#1d3546";for(let i=0;i<18;i++){x.beginPath();x.moveTo(i*60,0);x.lineTo(i*60,c.height);x.stroke()}x.fillStyle="#1f3441";x.fillRect(0,368,c.width,4);x.fillStyle="#7ee787";x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle="#071017";x.fillRect(p.x+24,p.y+9,6,6);for(const o of obs){x.fillStyle="#ff7b72";x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle="#ffb3ad";x.fillText("BUG",o.x+3,o.y-5)}for(const o of tokens){x.fillStyle="#58a6ff";x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle="#fff";x.font="11px monospace";x.fillText(o.label,o.x-2,o.y-6)}}draw();
</script></main></body></html>
