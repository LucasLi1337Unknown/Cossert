<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Exclusion</title><link rel="stylesheet" href="style.css"></head><body><main>
<div class="top"><h1>Random Exclusion</h1><a href="index.html">← Arcade</a></div>
<div class="card"><div class="big" id="expr"></div><p>Can the shown result legally come from this expression?</p>
<div class="big" id="result"></div><button onclick="judge(true)">VALID</button> <button onclick="judge(false)">INVALID</button><p id="msg"></p><div class="score">Score: <span id="score">0</span></div></div>
<script>
let a,b,x,r,sc=0;
function next(){a=1+Math.floor(Math.random()*5);b=a+4+Math.floor(Math.random()*6);x=a+Math.floor(Math.random()*(b-a+1));r=Math.random()<.7?a+Math.floor(Math.random()*(b-a+1)):b+1+Math.floor(Math.random()*3);expr.textContent=`PICKARANDOM(FROM(${a})TO(${b})W/O(${x}))`;result.textContent=`Result: ${r}`;msg.textContent=""}
function judge(v){let ok=r>=a&&r<=b&&r!==x;if(v===ok){sc++;msg.textContent="Correct!"}else{sc=Math.max(0,sc-1);msg.textContent=`Wrong. Valid means in ${a}..${b} and not ${x}.`}score.textContent=sc;setTimeout(next,700)}
next()
</script></main></body></html>
