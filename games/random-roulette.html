<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Roulette</title><link rel="stylesheet" href="style.css"></head><body><main><div class="top"><h1>🎯 Random Roulette</h1><a href="index.html">← Arcade</a></div><div class="card center"><p><code>PICKARANDOM(FROM(1)TO(9)W/O(<span id="ban">5</span>))</code></p><p>Click the giant number if it is valid. If it equals the excluded value, hit <b>SKIPTIS!</b> instead. You have 30 seconds.</p><div class="hud" style="justify-content:center"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Combo: <b id="combo">0</b>x</span><span class="pill">Time: <b id="time">30</b>s</span></div><button id="number" style="font-size:80px;min-width:210px;min-height:150px;margin:20px">?</button><br><button class="secondary" id="skip">SKIPTIS!</button><p id="msg" class="muted">Press Start.</p><button id="start">Start</button></div><script>
const banEl=document.getElementById("ban"),num=document.getElementById("number"),skip=document.getElementById("skip"),S=document.getElementById("score"),C=document.getElementById("combo"),T=document.getElementById("time"),M=document.getElementById("msg"),startBtn=document.getElementById("start");let ban=5,current=0,score=0,combo=0,time=30,running=false,timer;function next(){ban=1+Math.floor(Math.random()*9);current=1+Math.floor(Math.random()*9);banEl.textContent=ban;num.textContent=current;num.style.transform="scale(1.05)";setTimeout(()=>num.style.transform="",80)}function hit(valid){if(!running)return;let correct=(current!==ban)===valid;if(correct){combo++;score+=1+Math.floor(combo/5);M.textContent=combo>=5?"🔥 "+combo+" combo!":"Correct!"}else{combo=0;score=Math.max(0,score-2);M.textContent="NOPE 💀"}S.textContent=score;C.textContent=combo;next()}num.onclick=()=>hit(true);skip.onclick=()=>hit(false);startBtn.onclick=()=>{clearInterval(timer);score=0;combo=0;time=30;running=true;S.textContent=0;C.textContent=0;T.textContent=30;M.textContent="GO!";next();timer=setInterval(()=>{time--;T.textContent=time;if(time<=0){clearInterval(timer);running=false;M.innerHTML='<span class="win">TIME!</span> Final score: '+score}},1000)}
</script></main></body></html>
