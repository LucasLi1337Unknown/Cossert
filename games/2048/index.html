<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert 2048</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<div class="gameTop"><h1>Cossert 2048</h1><a class="back" href="../">← Arcade</a></div>
<div class="panel"><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill" id="stat">Ready</div></div><canvas id="game" width="448" height="448"></canvas><div class="controls"><button id="restart">Restart</button></div><div class="dpad"><button class="up secondary" data-key="ArrowUp">↑</button><button class="left secondary" data-key="ArrowLeft">←</button><button class="down secondary" data-key="ArrowDown">↓</button><button class="right secondary" data-key="ArrowRight">→</button></div><p class="help">Arrow keys or D-pad. Merge equal tiles. Reach 2048.</p><p class="source">Game data/rules: <a href="game.cossert">game.cossert</a> · Runtime: <a href="../interpreter.js">interpreter.js</a></p></div>
</div><script src="../interpreter.js"></script><script>
let rt,c=game,x=c.getContext("2d"),b,sc=0;const N=4,S=112;
function empty(){let a=[];for(let r=0;r<N;r++)for(let q=0;q<N;q++)if(!b[r][q])a.push([r,q]);return a}
function spawn(){let e=empty();if(!e.length)return;let [r,q]=e[Math.floor(Math.random()*e.length)];b[r][q]=rt.randomFromList("spawnValues")}
function reset(){b=Array.from({length:N},()=>Array(N).fill(0));sc=0;spawn();spawn();draw()}
function merge(row){let a=row.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;sc+=a[i];a.splice(i+1,1)}while(a.length<N)a.push(0);return a}
function move(k){let old=JSON.stringify(b);if(k==="ArrowLeft")b=b.map(merge);if(k==="ArrowRight")b=b.map(r=>merge([...r].reverse()).reverse());if(k==="ArrowUp"||k==="ArrowDown"){for(let q=0;q<N;q++){let col=[];for(let r=0;r<N;r++)col.push(b[r][q]);if(k==="ArrowDown")col.reverse();col=merge(col);if(k==="ArrowDown")col.reverse();for(let r=0;r<N;r++)b[r][q]=col[r]}}if(JSON.stringify(b)!==old)spawn();draw();if(b.flat().includes(rt.value("target",0,2048)))stat.textContent="YOU MADE 2048!";else if(!empty().length)stat.textContent="Board full — keep merging or restart"}
function draw(){x.fillStyle="#0b1727";x.fillRect(0,0,c.width,c.height);for(let r=0;r<N;r++)for(let q=0;q<N;q++){let v=b[r][q],xx=q*S+8,yy=r*S+8;x.fillStyle=v?"#274a70":"#13263e";x.fillRect(xx,yy,S-12,S-12);if(v){x.fillStyle="#f8fbff";x.font=(v>=1024?30:38)+"px system-ui";x.fontWeight="900";x.textAlign="center";x.fillText(v,xx+(S-12)/2,yy+60)}}score.textContent=sc;stat.textContent="Target "+rt.value("target",0,2048)}
addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();move(e.key)}});document.querySelectorAll("[data-key]").forEach(bu=>bu.onclick=()=>move(bu.dataset.key));restart.onclick=reset;loadCossert("game.cossert").then(v=>{rt=v;reset()});
</script></body></html>
