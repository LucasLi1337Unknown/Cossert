<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Exclusion</title><link rel="stylesheet" href="../style.css"></head><body><main><div class="top"><h1>Random Exclusion</h1><a href="../">← Arcade</a></div><div class="card"><p>Cossert chooses 1–9 while excluding <b id="excluded">5</b>.</p><div class="big" id="number">?</div><div class="score">Valid rolls: <span id="score">0</span></div><button id="roll">Run Cossert random</button></div><p class="muted">Logic source: <a href="game.cossert">game.cossert</a></p></main><script src="../interpreter.js"></script><script>
let rt,sc=0;loadCossert("game.cossert").then(x=>rt=x);roll.onclick=()=>{if(!rt)return;let n=rt.evalRandom(rt.source);number.textContent=n;if(rt.compare(n,"!=",5)){sc++;score.textContent=sc}};
</script></body></html>
