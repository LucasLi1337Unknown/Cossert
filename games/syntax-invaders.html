<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syntax Invaders</title><link rel="stylesheet" href="style.css"></head><body><main><div class="top"><h1>👾 Syntax Invaders</h1><a href="index.html">← Arcade</a></div><div class="card"><p>Shoot the <b class="lose">fake syntax</b>. Do NOT shoot real Cossert forms. Move with A/D or arrows, fire with Space.</p><div class="hud"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Lives: <b id="lives">3</b></span></div><canvas id="game" width="900" height="520"></canvas><p id="msg" class="center muted">Press Space to start.</p></div><script>
const c=document.getElementById("game"),g=c.getContext("2d"),S=document.getElementById("score"),L=document.getElementById("lives"),M=document.getElementById("msg"),real=["SKIPTIS","FRGETABTIT","FINALANSER","PICKARANDOM","TAKITOUT"],fake=["BREAKNOW","ELSEIF","RETURNIT","RANDOMIZE","DELETEITEM","GOTO"];let ship={x:420,y:470,w:60,h:24},shots=[],enemies=[],keys={},score=0,lives=3,running=false,last=0,spawn=0;
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"){e.preventDefault();if(!running)start();else fire()}});addEventListener("keyup",e=>keys[e.code]=false);function start(){score=0;lives=3;shots=[];enemies=[];ship.x=420;spawn=0;running=true;last=performance.now();S.textContent=0;L.textContent=3;M.textContent="";requestAnimationFrame(loop)}function fire(){if(shots.length<5)shots.push({x:ship.x+28,y:ship.y-10,w:4,h:15})}
function loop(t){if(!running)return;let dt=Math.min(32,t-last);last=t;if(keys.ArrowLeft||keys.KeyA)ship.x-=7;if(keys.ArrowRight||keys.KeyD)ship.x+=7;ship.x=Math.max(0,Math.min(840,ship.x));spawn-=dt;if(spawn<=0){let isReal=Math.random()<.42,label=(isReal?real:fake)[Math.floor(Math.random()*(isReal?real.length:fake.length))];enemies.push({x:20+Math.random()*760,y:-30,w:110,h:28,label,isReal,v:1.2+Math.random()*1.5});spawn=430}shots.forEach(s=>s.y-=9);enemies.forEach(e=>e.y+=e.v);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];for(let j=shots.length-1;j>=0;j--){let s=shots[j];if(s.x<e.x+e.w&&s.x+s.w>e.x&&s.y<e.y+e.h&&s.y+s.h>e.y){shots.splice(j,1);enemies.splice(i,1);if(e.isReal){lives--;L.textContent=lives}else{score++;S.textContent=score}break}}if(e.y>520){if(!e.isReal){lives--;L.textContent=lives}enemies.splice(i,1)}}shots=shots.filter(s=>s.y>-30);if(lives<=0){running=false;M.innerHTML='<span class="lose">GAME OVER.</span> Score '+score+'. Press Space to retry.';draw();return}draw();requestAnimationFrame(loop)}
function draw(){g.fillStyle="#05080b";g.fillRect(0,0,c.width,c.height);for(let i=0;i<80;i++){g.fillStyle=i%3?"#17222a":"#284154";g.fillRect((i*97)%900,(i*53)%520,2,2)}g.fillStyle="#7ee787";g.fillRect(ship.x,ship.y,ship.w,ship.h);g.fillRect(ship.x+25,ship.y-12,10,12);g.fillStyle="#f2cc60";shots.forEach(s=>g.fillRect(s.x,s.y,s.w,s.h));g.font="13px monospace";enemies.forEach(e=>{g.fillStyle=e.isReal?"#58a6ff":"#ff7b72";g.fillRect(e.x,e.y,e.w,e.h);g.fillStyle="#061018";g.textAlign="center";g.fillText(e.label,e.x+e.w/2,e.y+19)});g.textAlign="left"}draw();
</script></main></body></html>
