<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert Invaders</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<div class="gameTop"><h1>Cossert Invaders</h1><a class="back" href="../">← Arcade</a></div>
<div class="panel"><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill" id="stat">Ready</div></div><canvas id="game" width="740" height="440"></canvas><div class="controls"><button id="left" class="secondary">← Move</button><button id="fire">FIRE</button><button id="right" class="secondary">Move →</button><button id="restart" class="secondary">Restart</button></div><p class="help">Arrow keys to move, Space to fire. Clear waves before they descend.</p><p class="source">Game data/rules: <a href="game.cossert">game.cossert</a> · Runtime: <a href="../interpreter.js">interpreter.js</a></p></div>
</div><script src="../interpreter.js"></script><script>
let rt,c=game,x=c.getContext("2d"),px,shots,enemies,dir,wave,lives,sc,keys={},raf;
function newWave(){enemies=[];let rows=rt.list("enemyRows")[Math.min(wave-1,2)];for(let r=0;r<rows;r++)for(let i=0;i<8;i++)enemies.push({x:95+i*68,y:55+r*48,w:30,h:24})}
function reset(){cancelAnimationFrame(raf);px=350;shots=[];wave=1;lives=rt.value("player",0,3);sc=0;dir=1;newWave();loop()}
function shoot(){if(shots.length<4)shots.push({x:px+14,y:400})}
function loop(){if(keys.ArrowLeft)px=Math.max(0,px-rt.value("player",1,7));if(keys.ArrowRight)px=Math.min(690,px+rt.value("player",1,7));shots.forEach(s=>s.y-=9);shots=shots.filter(s=>s.y>-20);let speed=rt.list("waveSpeed")[Math.min(wave-1,4)],edge=false;enemies.forEach(e=>{e.x+=speed*dir;if(e.x<20||e.x>710)edge=true});if(edge){dir*=-1;enemies.forEach(e=>e.y+=18)}for(let s of shots)for(let e of enemies)if(!e.dead&&!s.dead&&s.x>e.x&&s.x<e.x+e.w&&s.y>e.y&&s.y<e.y+e.h){e.dead=s.dead=true;sc+=rt.randomFromList("enemyScore")}shots=shots.filter(s=>!s.dead);enemies=enemies.filter(e=>!e.dead);if(enemies.some(e=>e.y>385)){lives--;dir=1;newWave();if(lives<=0){draw();stat.textContent="GAME OVER";return}}if(enemies.length===0){wave++;dir=1;newWave()}draw();raf=requestAnimationFrame(loop)}
function draw(){x.fillStyle="#050b16";x.fillRect(0,0,740,440);x.fillStyle="#38bdf8";x.fillRect(px,410,42,16);x.fillStyle="#e0f2fe";shots.forEach(s=>x.fillRect(s.x,s.y,4,12));x.fillStyle="#a78bfa";enemies.forEach(e=>x.fillRect(e.x,e.y,e.w,e.h));score.textContent=sc;stat.textContent="Wave "+wave+" · Lives "+lives}
addEventListener("keydown",e=>{keys[e.key]=true;if(e.code==="Space"){e.preventDefault();shoot()}});addEventListener("keyup",e=>keys[e.key]=false);left.onpointerdown=()=>keys.ArrowLeft=true;left.onpointerup=left.onpointerleave=()=>keys.ArrowLeft=false;right.onpointerdown=()=>keys.ArrowRight=true;right.onpointerup=right.onpointerleave=()=>keys.ArrowRight=false;fire.onclick=shoot;restart.onclick=reset;loadCossert("game.cossert").then(v=>{rt=v;reset()});
</script></body></html>
