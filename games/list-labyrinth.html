<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List Labyrinth</title><link rel="stylesheet" href="style.css"></head><body><main><div class="top"><h1>🧩 List Labyrinth</h1><a href="index.html">← Arcade</a></div><div class="card"><p>Collect slots <b>1 → 2 → 3 → 4</b>, then reach EXIT. Arrow keys/WASD.</p><div class="hud"><span class="pill">Next slot: <b id="next">1</b></span><span class="pill">Moves: <b id="moves">0</b></span></div><canvas id="game" width="720" height="520"></canvas><p id="msg" class="center muted">Find slot 1.</p><button onclick="build()">New Maze</button></div><script>
const c=document.getElementById("game"),g=c.getContext("2d"),cols=18,rows=13,sz=40,N=document.getElementById("next"),Mv=document.getElementById("moves"),M=document.getElementById("msg");let grid,p,slots,goal=1,moves=0;
function build(){grid=Array.from({length:rows},()=>Array(cols).fill(0));for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(Math.random()<.14)grid[y][x]=1;for(let x=0;x<cols;x++)grid[0][x]=grid[rows-1][x]=1;for(let y=0;y<rows;y++)grid[y][0]=grid[y][cols-1]=1;for(let x=1;x<cols-1;x++)grid[1][x]=0;for(let y=1;y<rows-1;y++)grid[y][cols-2]=0;p={x:1,y:1};grid[rows-2][cols-2]=0;slots=[];for(let n=1;n<=4;n++){let q;do q={x:1+Math.floor(Math.random()*(cols-2)),y:1+Math.floor(Math.random()*(rows-2)),n};while(grid[q.y][q.x]||slots.some(s=>s.x===q.x&&s.y===q.y)||(q.x===1&&q.y===1));slots.push(q);grid[q.y][q.x]=0}goal=1;moves=0;N.textContent=1;Mv.textContent=0;M.textContent="Find slot 1.";draw()}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(grid[ny][nx])return;p={x:nx,y:ny};moves++;Mv.textContent=moves;let s=slots.find(s=>s.x===p.x&&s.y===p.y);if(s&&s.n===goal){goal++;N.textContent=goal<=4?goal:"EXIT";M.textContent=goal<=4?"Good. Find slot "+goal+".":"All slots stable. Reach EXIT!"}if(p.x===cols-2&&p.y===rows-2&&goal===5)M.innerHTML='<span class="win">ESCAPED in '+moves+' moves!</span>';draw()}addEventListener("keydown",e=>{let d={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(d){e.preventDefault();move(...d)}})
function draw(){g.fillStyle="#05080b";g.fillRect(0,0,c.width,c.height);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x]){g.fillStyle="#23303b";g.fillRect(x*sz,y*sz,sz-2,sz-2)}slots.forEach(s=>{g.fillStyle=s.n<goal?"#2ea043":"#58a6ff";g.fillRect(s.x*sz+7,s.y*sz+7,26,26);g.fillStyle="#fff";g.font="bold 15px monospace";g.fillText(s.n,s.x*sz+15,s.y*sz+26)});g.fillStyle="#f2cc60";g.fillRect((cols-2)*sz+6,(rows-2)*sz+6,28,28);g.fillStyle="#071017";g.font="10px monospace";g.fillText("EXIT",(cols-2)*sz+8,(rows-2)*sz+24);g.fillStyle="#7ee787";g.beginPath();g.arc(p.x*sz+20,p.y*sz+20,13,0,Math.PI*2);g.fill()}build();
</script></main></body></html>
