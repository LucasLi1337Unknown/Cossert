<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyword Catch</title><link rel="stylesheet" href="../style.css"></head><body><main><div class="top"><h1>Keyword Catch</h1><a href="../">← Arcade</a></div><div class="card"><div class="score">Score: <span id="s">0</span></div><p>Click only the entries declared in Cossert's <code>"real"</code> list.</p></div><div id="arena" class="grid"></div><button id="restart">Restart</button><p class="muted">Logic source: <a href="game.cossert">game.cossert</a></p></main><script src="../interpreter.js"></script><script>
let rt,score=0;const arena=document.getElementById("arena"),s=document.getElementById("s");
function fill(){let a=[...rt.list("real"),...rt.list("fake")].sort(()=>Math.random()-.5).slice(0,12);arena.innerHTML="";a.forEach(x=>{let b=document.createElement("button");b.className="slot";b.textContent=x;b.onclick=()=>{if(rt.list("real").includes(x)){score++;b.disabled=true;b.classList.add("good")}else{score=Math.max(0,score-1);b.classList.add("bad")}s.textContent=score};arena.appendChild(b)})}
restart.onclick=()=>{score=0;s.textContent=0;fill()};loadCossert("game.cossert").then(x=>{rt=x;fill()});
</script></body></html>
