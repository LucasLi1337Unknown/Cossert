<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert Snake</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<div class="gameTop"><h1>Cossert Snake</h1><a class="back" href="../">← Arcade</a></div>
<div class="panel"><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill" id="stat">Ready</div></div><canvas id="game" width="720" height="480"></canvas><div class="controls"><button id="restart">Restart</button></div><div class="dpad"><button class="up secondary" data-key="ArrowUp">↑</button><button class="left secondary" data-key="ArrowLeft">←</button><button class="down secondary" data-key="ArrowDown">↓</button><button class="right secondary" data-key="ArrowRight">→</button></div><p class="help">Arrow keys or the D-pad. Eat food, grow, and survive.</p><p class="source">Game data/rules: <a href="game.cossert">game.cossert</a> · Runtime: <a href="../interpreter.js">interpreter.js</a></p></div>
</div><script src="../interpreter.js"></script><script>
let rt,c=document.getElementById("game"),x=c.getContext("2d"),scoreEl=score,statEl=stat,snake,dir,next,food,sc,timer,level;
const cell=30,cols=24,rows=16;
function spawn(){do{food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function reset(){clearInterval(timer);snake=rt.list("startSnake").map(v=>{let [a,b]=v.split(",").map(Number);return{x:a,y:b}});dir=next={x:1,y:0};sc=0;level=0;spawn();run();draw()}
function run(){clearInterval(timer);let speeds=rt.list("speedMs");timer=setInterval(step,speeds[Math.min(level,speeds.length-1)])}
function step(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=cols||h.y>=rows||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);statEl.textContent="Game over — press Restart";return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){sc+=rt.randomFromList("foodValues");level=Math.floor(sc/80);spawn();run()}else snake.pop();draw()}
function draw(){x.fillStyle="#07101d";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#10233c";for(let i=0;i<=cols;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,c.height);x.stroke()}for(let j=0;j<=rows;j++){x.beginPath();x.moveTo(0,j*cell);x.lineTo(c.width,j*cell);x.stroke()}x.fillStyle="#34d399";snake.forEach((p,i)=>x.fillRect(p.x*cell+3,p.y*cell+3,cell-6,cell-6));x.fillStyle="#fb7185";x.beginPath();x.arc(food.x*cell+15,food.y*cell+15,10,0,7);x.fill();scoreEl.textContent=sc;statEl.textContent="Speed "+(level+1)}
function turn(k){let n=k==="ArrowUp"?{x:0,y:-1}:k==="ArrowDown"?{x:0,y:1}:k==="ArrowLeft"?{x:-1,y:0}:k==="ArrowRight"?{x:1,y:0}:null;if(n&&!(n.x===-dir.x&&n.y===-dir.y))next=n}
addEventListener("keydown",e=>turn(e.key));document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>turn(b.dataset.key));restart.onclick=reset;loadCossert("game.cossert").then(v=>{rt=v;reset()});
</script></body></html>
