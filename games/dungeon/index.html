<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert Dungeon</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap">
<div class="gameTop"><h1>Cossert Dungeon</h1><a class="back" href="../">← Arcade</a></div>
<div class="panel"><div class="hud"><div class="pill">Score <span id="score">0</span></div><div class="pill" id="stat">Ready</div></div><canvas id="game" width="640" height="480"></canvas><div class="controls"><button id="restart">Restart</button></div><div class="dpad"><button class="up secondary" data-key="ArrowUp">↑</button><button class="left secondary" data-key="ArrowLeft">←</button><button class="down secondary" data-key="ArrowDown">↓</button><button class="right secondary" data-key="ArrowRight">→</button></div><p class="help">Find 🔑, grab 💎 if you dare, and reach 🚪.</p><p class="source">Game data/rules: <a href="game.cossert">game.cossert</a> · Runtime: <a href="../interpreter.js">interpreter.js</a></p></div>
</div><script src="../interpreter.js"></script><script>
let rt,c=game,x=c.getContext("2d"),map,p,key=false,treasure=false,sc=0;const S=32;
function init(){map=rt.list("map").map(r=>r.split(""));for(let y=0;y<map.length;y++)for(let xx=0;xx<map[y].length;xx++)if(map[y][xx]==="P"){p={x:xx,y};map[y][xx]="."}draw()}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy,t=map[ny]?.[nx];if(!t||t==="#")return;if(t==="K"){key=true;map[ny][nx]=".";sc+=25}if(t==="T"){treasure=true;map[ny][nx]=".";sc+=rt.randomFromList("treasureScores")}if(t==="E"){if(!key){stat.textContent="The exit is locked — find the key!";return}else{sc+=treasure?100:50;score.textContent=sc;stat.textContent="ESCAPED! Restart for another run.";return}}p={x:nx,y:ny};draw()}
function draw(){x.fillStyle="#07101d";x.fillRect(0,0,c.width,c.height);for(let y=0;y<map.length;y++)for(let xx=0;xx<map[y].length;xx++){let t=map[y][xx];x.fillStyle=t==="#"?"#24364d":"#0c1a2c";x.fillRect(xx*S,y*S,S-1,S-1);if(t==="K"||t==="T"||t==="E"){x.font="22px system-ui";x.fillText(t==="K"?"🔑":t==="T"?"💎":"🚪",xx*S+5,y*S+24)}}x.font="23px system-ui";x.fillText("🧙",p.x*S+4,p.y*S+24);score.textContent=sc;stat.textContent=(key?"🔑 ":"")+(treasure?"💎 ":"")+"Find the exit"}
function go(k){if(k==="ArrowUp")move(0,-1);if(k==="ArrowDown")move(0,1);if(k==="ArrowLeft")move(-1,0);if(k==="ArrowRight")move(1,0)}
addEventListener("keydown",e=>go(e.key));document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>go(b.dataset.key));restart.onclick=()=>{key=false;treasure=false;sc=0;init()};loadCossert("game.cossert").then(v=>{rt=v;init()});
</script></body></html>
