<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake</title><link rel="stylesheet" href="style.css"></head><body><main><div class="top"><h1>🐍 Neon Snake</h1><a href="index.html">← Arcade</a></div><div class="card"><p>Eat blue Cossert tokens. Every 5 points adds a red corruption block. Use arrows or WASD.</p><div class="hud"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Best: <b id="best">0</b></span></div><canvas id="game" width="600" height="600"></canvas><p id="msg" class="center muted">Press an arrow key or WASD to start.</p></div><script>
const c=document.getElementById("game"),g=c.getContext("2d"),S=document.getElementById("score"),B=document.getElementById("best"),M=document.getElementById("msg"),N=20,Z=30;let snake,dir,next,food,rocks,score,running=false,timer,best=+localStorage.cossertSnakeBest||0;B.textContent=best;
function pos(){return{x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}function occupied(p){return snake.some(s=>s.x===p.x&&s.y===p.y)||rocks.some(s=>s.x===p.x&&s.y===p.y)}function newFood(){do food=pos();while(occupied(food))}function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;rocks=[];score=0;S.textContent=0;newFood();draw()}function start(){if(running)return;running=true;M.textContent="";clearInterval(timer);timer=setInterval(step,105)}
function key(e){let d={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(!d)return;e.preventDefault();if(d[0]!==-dir.x||d[1]!==-dir.y)next={x:d[0],y:d[1]};start()}addEventListener("keydown",key);
function step(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)||rocks.some(r=>r.x===h.x&&r.y===h.y)){running=false;clearInterval(timer);best=Math.max(best,score);localStorage.cossertSnakeBest=best;B.textContent=best;M.innerHTML='<span class="lose">CRASH.</span> Press a direction key to retry.';reset();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;S.textContent=score;if(score%5===0){let r;do r=pos();while(occupied(r));rocks.push(r)}newFood()}else snake.pop();draw()}
function draw(){g.fillStyle="#05080b";g.fillRect(0,0,600,600);g.strokeStyle="#10202c";for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*Z,0);g.lineTo(i*Z,600);g.stroke();g.beginPath();g.moveTo(0,i*Z);g.lineTo(600,i*Z);g.stroke()}rocks.forEach(r=>{g.fillStyle="#ff7b72";g.fillRect(r.x*Z+4,r.y*Z+4,Z-8,Z-8)});g.fillStyle="#58a6ff";g.fillRect(food.x*Z+5,food.y*Z+5,Z-10,Z-10);snake.forEach((s,i)=>{g.fillStyle=i===0?"#7ee787":"#2ea043";g.fillRect(s.x*Z+3,s.y*Z+3,Z-6,Z-6)})}reset();
</script></main></body></html>
