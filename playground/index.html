<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cossert Compatibility Playground</title><style>body{font-family:monospace;margin:0;background:#111;color:#eee;padding:28px}main{max-width:900px;margin:auto}textarea{width:100%;height:300px;background:#050505;color:#eee;padding:18px;border:1px solid #444;border-radius:12px}button{padding:10px 16px;margin:10px 8px 10px 0}pre{white-space:pre-wrap;background:#050505;padding:18px;border-radius:12px;border:1px solid #333}.tag{display:inline-block;padding:5px 8px;border:1px solid #555;border-radius:999px}</style></head><body><main><span class="tag">Cossert 0.2 Center</span><h1>Compatibility-Core Playground</h1><p>Recognizes preserved Cossert forms without pretending to be a complete 0.2 interpreter.</p><textarea id="src">HAV A LIST "things" LIKE ["A", "B", "C"]:
TAKITOUT{things}[1]
PICKARANDOM(FROM(1)TO(10)W/O(5))
FINALANSER(47)</textarea><br><button onclick="run()">Inspect syntax</button><button onclick="document.getElementById('out').textContent='Ready.'">Clear</button><pre id="out">Ready.</pre><script>function run(){const s=document.getElementById('src').value;let a=[];[['SKIPTIS','skip current loop iteration'],['FRGETABTIT','exit loop'],['FINALANSER','return value'],['PICKARANDOM','random selection'],['HAV A LIST','list declaration'],['TAKITOUT','stable-slot removal']].forEach(x=>{if(s.includes(x[0]))a.push('FOUND '+x[0]+' -> '+x[1])});if(/else\s+if/i.test(s))a.push('WARNING: no else if.');a.push('\nFull 0.2 parsing awaits official grammar.');document.getElementById('out').textContent=a.join('\n')}</script></main></body></html>
